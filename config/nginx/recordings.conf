# Podgląd nagrań przez HTTP (tylko do odczytu), dostępny wyłącznie z LAN VM.
server {
    listen 8080;
    server_name _;

    allow 192.168.196.0/24;
    allow 127.0.0.1;
    deny all;

    location /recordings/ {
        alias /opt/cameras/recordings/;
        autoindex on;
        autoindex_localtime on;
        autoindex_exact_size off;
        limit_except GET HEAD { deny all; }
    }
}
