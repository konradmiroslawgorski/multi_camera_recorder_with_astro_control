location:
  latitude: 52.2297
  longitude: 21.0122
  timezone: Europe/Warsaw

recording_window:
  start: "sunrise - 1h"
  stop:  "sunset + 1h"

segment:
  duration_minutes: 15

notifications:
  error_group_minutes: 60
  start_timeout_seconds: 60
  ntfy:
    enabled: true
    server: https://ntfy.sh
    # Nazwa tematu (sekret) w zmiennej NTFY_TOPIC lub w config/notify.env
    topic_env: NTFY_TOPIC
    timeout_seconds: 10